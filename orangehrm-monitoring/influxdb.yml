version: '3.8'

services:
  influxdb:
    image: influxdb:1.8-alpine
    container_name: orangehrm-gatling-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"    # HTTP API InfluxDB
      - "2003:2003"    # Port Graphite pour recevoir les données Gatling
    environment:
      - INFLUXDB_DB=gatling
      - INFLUXDB_USER=gatling
      - INFLUXDB_USER_PASSWORD=gatling123
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
      # Configuration Graphite via variables d'environnement
      - INFLUXDB_GRAPHITE_ENABLED=true
      - INFLUXDB_GRAPHITE_DATABASE=gatling
      - INFLUXDB_GRAPHITE_BIND_ADDRESS=:2003
      - INFLUXDB_GRAPHITE_PROTOCOL=tcp
    volumes:
      - influxdb_data:/var/lib/influxdb
      # Supprimé temporairement le fichier de config
      # - ../gatling-v2-influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro
    networks:
      - orangehrm-monitoring-network

volumes:
  influxdb_data:

networks:
  orangehrm-monitoring-network:
    external: true