modules:
  # Test HTTP simple
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      headers:
        User-Agent: "Blackbox Exporter"
      no_follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false

  # Test HTTP avec authentification
  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: POST
      headers:
        Content-Type: "application/x-www-form-urlencoded"
      body: "username=admin&password=test"

  # Test page de login OrangeHRM
  orangehrm_login:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      headers:
        User-Agent: "OrangeHRM Monitor"
      no_follow_redirects: false
      fail_if_body_not_matches_regexp:
        - "OrangeHRM|login|username"

  # Test TCP simple
  tcp_connect:
    prober: tcp
    timeout: 5s