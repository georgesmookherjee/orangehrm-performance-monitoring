version: '3.8'

services:
  orangehrm-mysql-exporter-distant:
    image: prom/mysqld-exporter:latest
    container_name: orangehrm-mysql-exporter-distant
    restart: unless-stopped
    ports:
      - "9104:9104"
    command:
      - "--mysqld.username=exporter"
      - "--mysqld.address=hungry_franklin:3306"
    environment:
      - MYSQLD_EXPORTER_PASSWORD=exporter123
    networks:
      - orangehrm-monitoring-network

  orangehrm-prometheus-distant:
    image: prom/prometheus:latest
    container_name: orangehrm-prometheus-distant
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./orangehrm-prometheus-distant.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - orangehrm-monitoring-network
    depends_on:
      - orangehrm-mysql-exporter-distant

  orangehrm-grafana-monitoring:
    image: grafana/grafana:latest
    container_name: orangehrm-grafana-monitoring
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    networks:
      - orangehrm-monitoring-network
    depends_on:
      - orangehrm-prometheus-distant

  orangehrm-node-exporter:
    image: prom/node-exporter:latest
    container_name: orangehrm-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
      # Pas de collector.netdev.device-exclude pour éviter les erreurs
    volumes:
      # Version Windows-compatible
      - '/:/host:ro'
      # Commenté temporairement si ça pose problème :
      # - '/proc:/host/proc:ro'
      # - '/sys:/host/sys:ro'
    networks:
      - orangehrm-monitoring-network
    # Ignorer les erreurs de certains collectors sur Windows
    environment:
      - NODE_EXPORTER_DISABLE_COLLECTORS="arp,bcache,bonding,conntrack,edac,entropy,filefd,hwmon,infiniband,ipvs,mdadm,netclass,netstat,nfs,nfsd,sockstat,textfile,time,timex,vmstat,xfs,zfs"

  # Loki - Stockage des logs
  orangehrm-loki:
    image: grafana/loki:2.9.0
    container_name: orangehrm-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./orangehrm-loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - orangehrm-monitoring-network

  # Promtail - Collecteur de logs
  orangehrm-promtail:
    image: grafana/promtail:2.9.0
    container_name: orangehrm-promtail
    restart: unless-stopped
    volumes:
      - ./orangehrm-promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - orangehrm-monitoring-network
    depends_on:
      - orangehrm-loki

  # Blackbox Exporter - Tests externes
  orangehrm-blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: orangehrm-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./orangehrm-blackbox-config.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - orangehrm-monitoring-network

networks:
  orangehrm-monitoring-network:
    external: true

volumes:
  loki_data: