global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'orangehrm-distant-monitor'

scrape_configs:
  # Monitoring de Prometheus lui-même
  - job_name: 'orangehrm-prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Monitoring MySQL via l'exporter distant
  - job_name: 'orangehrm-mysql-distant'
    static_configs:
      - targets: ['orangehrm-mysql-exporter-distant:9104']
        labels:
          environment: 'test'
          service: 'orangehrm-database'
          location: 'distant'
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Monitoring InfluxDB pour Gatling
  - job_name: 'orangehrm-influxdb-gatling'
    static_configs:
      - targets: [ 'orangehrm-gatling-influxdb:8086' ]  # ✅ Nom cohérent
        labels:
          environment: 'test'
          service: 'gatling-metrics'
    scrape_interval: 30s
    metrics_path: /metrics

  - job_name: 'orangehrm-node-exporter'
    static_configs:
      - targets: [ 'orangehrm-node-exporter:9100' ]
    scrape_interval: 10s
    metrics_path: /metrics

  # Blackbox Exporter - Tests de disponibilité
  - job_name: 'orangehrm-blackbox'
    metrics_path: /probe
    params:
      module: [ http_2xx ]
    static_configs:
      - targets:
          - http://kind_ardinghelli:80  # Test page d'accueil OrangeHRM
          - http://kind_ardinghelli:80/web/index.php/auth/login  # Test page login
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: orangehrm-blackbox-exporter:9115

#  - job_name: 'orangehrm-cadvisor'
